<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gate probe</title><link rel="stylesheet" href="../src/styles/theme.css">
<style>
  body { margin:0; padding:var(--space-32); background:var(--color-surface-page); color:var(--color-text-primary);
         font-family:var(--font-sans); font-size:var(--text-base); line-height:var(--leading-normal); }
  h1 { font-size:var(--text-5xl); line-height:var(--leading-tight); margin:0 0 var(--space-16); }
  p  { max-width:var(--measure-prose); color:var(--color-text-secondary); }
  a  { color:var(--color-text-link); }
  .btn { font:inherit; padding:var(--space-12) var(--space-20); border:var(--stroke-thin) solid transparent;
         border-radius:var(--radius-sm); background:var(--color-action-primary); color:var(--color-text-on-action);
         cursor:pointer; transition:background var(--duration-fast) var(--ease-out); }
  .btn:hover { background:var(--color-action-primary-hover); }
  .btn:focus-visible { outline:none; box-shadow:var(--shadow-focus-ring); }
</style></head>
<body>
  <main>
    <h1>Gate probe</h1>
    <p>This page exists only to prove the render gates measure real computed pixels. <a href="#x">A link</a>.</p>
    <button class="btn" type="button">Primary action</button>
  </main>
</body></html>
